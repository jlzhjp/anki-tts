version: "2"

run:
  timeout: 5m

linters:
  enable:
    # Default
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Correctness
    - errorlint
    - nilerr
    - nilnil
    - nilnesserr
    - wastedassign
    - bodyclose
    - contextcheck
    - fatcontext
    - noctx
    - durationcheck
    - rowserrcheck
    - sqlclosecheck
    - copyloopvar

    # Modern Go
    - modernize
    - intrange
    - exptostd
    - usestdlibvars

    # Security
    - gosec
    - depguard

    # Performance
    - prealloc
    - perfsprint

    # Code quality
    - gocritic
    - revive
    - misspell
    - unconvert
    - whitespace

    # Observability
    - loggercheck
    - sloglint
    - spancheck

    # Tests
    - testifylint
    - tparallel
    - paralleltest

  exclusions:
    generated: lax

  settings:
    govet:
      enable:
        - fieldalignment

    depguard:
      rules:
        main:
          files:
            - $all
          allow:
            - $gostd
            - charm.land/bubbles/v2
            - charm.land/bubbletea/v2
            - github.com/BurntSushi/toml
            - github.com/charmbracelet/x/term
            - github.com/spf13/cobra
            - golang.org/x/net/html
            - jlzhjp.dev/ankitts

    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: error-naming
        - name: errorf
        - name: context-as-argument

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - performance
        - style

formatters:
  enable:
    # Formatting
    - gofmt
    - gofumpt
    - goimports
